version: '3.8'

services:
  song-genre-api:
    build: .
    container_name: genre-predictor
    ports:
      - "xxxx:xxxx"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "xxxx:xxxx"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "xxxx:xxxx"
    restart: unless-stopped
    depends_on:
      - prometheus
